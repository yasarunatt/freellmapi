name: Deploy FreeLLMAPI to VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freellmapi-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "Missing GitHub Secret: VPS_HOST"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "Missing GitHub Secret: VPS_SSH_KEY"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER" || { echo "Missing GitHub Secret: VPS_USER"; exit 1; }

          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          APP_DIR="$HOME/freellmapi"
          REPO_URL="https://github.com/yasarunatt/freellmapi.git"

          if [ ! -d "$APP_DIR" ]; then
            git clone --branch main --depth 1 "$REPO_URL" "$APP_DIR"
          elif [ -d "$APP_DIR/.git" ]; then
            git -C "$APP_DIR" remote set-url origin "$REPO_URL"
            git -C "$APP_DIR" fetch --depth 1 origin main
            git -C "$APP_DIR" reset --hard origin/main
          else
            echo "STOP: $APP_DIR exists but is not a Git repository. Nothing was changed."
            exit 1
          fi

          cd "$APP_DIR"

          command -v docker >/dev/null 2>&1 || {
            echo "Docker is not installed on this VPS. Install Docker before deploying."
            exit 1
          }
          docker compose version >/dev/null 2>&1 || {
            echo "Docker Compose plugin is missing. Install it before deploying."
            exit 1
          }

          if [ ! -f .env ]; then
            ENCRYPTION_KEY="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")"
            printf 'ENCRYPTION_KEY=%s\nHOST_BIND=127.0.0.1\nPORT=3001\n' "$ENCRYPTION_KEY" > .env
            chmod 600 .env
          fi

          echo "Building FreeLLMAPI from yasarunatt/freellmapi..."
          docker compose build --pull
          docker compose up -d --remove-orphans

          CONTAINER_ID="$(docker compose ps -q freellmapi)"
          [ -n "$CONTAINER_ID" ] || {
            docker compose logs --tail=100 freellmapi
            exit 1
          }

          for attempt in $(seq 1 36); do
            STATUS="$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_ID" 2>/dev/null || true)"
            if [ "$STATUS" = "healthy" ]; then
              echo "FreeLLMAPI deployed and healthy."
              docker compose ps
              exit 0
            fi
            if [ "$STATUS" = "unhealthy" ]; then
              docker compose logs --tail=100 freellmapi
              exit 1
            fi
            sleep 5
          done

          echo "Health check timed out."
          docker compose logs --tail=100 freellmapi
          exit 1
          REMOTE
